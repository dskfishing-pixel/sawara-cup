<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>サワラ焼肉CUP</title>
  <meta name="theme-color" content="#0B3A5B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="サワラCUP">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🐟</span>
        <span class="brand-name">サワラ焼肉CUP</span>
      </div>
      <button class="sync" id="syncBtn" type="button" aria-label="同期状態"></button>
      <button class="gear" id="adminBtn" type="button" aria-label="管理">⚙︎</button>
    </header>
    <div class="datebar" id="datebar"></div>
    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" aria-label="画面切替">
      <button type="button" data-tab="rank"><span class="ti">🏆</span><span>ランキング</span></button>
      <button type="button" data-tab="input"><span class="ti">🎣</span><span>釣果入力</span></button>
      <button type="button" data-tab="log"><span class="ti">📋</span><span>CatchLog</span></button>
      <button type="button" data-tab="trips"><span class="ti">🚤</span><span>便設定</span></button>
      <button type="button" data-tab="sum"><span class="ti">📊</span><span>集計</span></button>
    </nav>
  </div>
  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="boot" class="boot">読み込み中…</div>

  <script src="config.js"></script>
  <script src="calc.js"></script>
  <script src="store.js"></script>
  <script src="tide.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
